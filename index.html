<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <div class="titlebar">
            <div class="title">Pixel Calc</div>

            <div class="controls">
                <button id="minBtn">—</button>
                <button id="closeBtn">✕</button>
            </div>
        </div>

        <div class="screen" id="screen">0</div>

        <div class="buttons">

            <button class="btn func" id="C">C</button>
            <button class="btn func" id="plusminus">±</button> <button class="btn func" id="percent">%</button>   <button class="btn op" id="divide">÷</button>      <button class="btn" id="7">7</button>
            <button class="btn" id="8">8</button>
            <button class="btn" id="9">9</button>
            <button class="btn op" id="multiply">×</button>    <button class="btn" id="4">4</button>
            <button class="btn" id="5">5</button>
            <button class="btn" id="6">6</button>
            <button class="btn op" id="minus">−</button>       <button class="btn" id="1">1</button>
            <button class="btn" id="2">2</button>
            <button class="btn" id="3">3</button>
            <button class="btn op" id="plus">+</button>        <button class="btn zero" id="0">0</button>
            <button class="btn" id="dot">.</button>            <button class="btn op" id="equal">=</button>       </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
